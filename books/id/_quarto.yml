project:
  type: book
  resources:
    - assets/ku.css

book:
  title: "Dasar Pemrograman Nim"
  subtitle: "Belajar bahasa Nim dari nol, dalam Bahasa Indonesia"
  author: "Fredianto"
  date: "2026-10-23"
  language: id
  chapters:
    - part: "Bagian 0: Mulai"
      chapters:
        - index.qmd
        - copyright.qmd
    - part: "Bagian A: Dasar"
      chapters:
        - chapters/what-is-nim.qmd
        - chapters/installation.qmd
        - chapters/workflow.qmd
        - chapters/comments.qmd
        - chapters/variables.qmd
        - chapters/primitive-types.qmd
        - chapters/strings.qmd
        - chapters/printing.qmd
        - chapters/operators.qmd
        - chapters/conditionals.qmd
        - chapters/loops.qmd
        - chapters/collections.qmd
        - chapters/procedures.qmd
        - chapters/tuples.qmd
        - chapters/objects.qmd
        - chapters/enums-and-sets.qmd
  appendices:
    - appendix/answers.qmd
  search: true
  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - text: "English"
        href: "https://nim.qouver.com/en/"
  page-footer:
    left: "CC BY-SA 4.0 · kode contoh MIT"
    right: "[PDF](https://nim.qouver.com/Dasar-Pemrograman-Nim.pdf) · [English](https://nim.qouver.com/en/)"

format:
  html:
    lang: id
    css: assets/ku.css
    toc: true
    toc-depth: 2
    toc-title: "Di halaman ini"
    code-copy: true
    code-overflow: wrap
    fig-cap-location: bottom
  typst:
    lang: id
    template-partials:
      - assets/typst/typst-show.typ
    papersize: a5
    number-sections: true
