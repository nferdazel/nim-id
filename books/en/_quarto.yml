project:
  type: book
  resources:
    - assets/ku.css

book:
  title: "Learning Nim"
  subtitle: "From zero to working programs"
  author: "Fredianto"
  date: "2026-10-23"
  language: en
  chapters:
    - part: "Part 0: Getting started"
      chapters:
        - index.qmd
        - copyright.qmd
    - part: "Part A: Fundamentals"
      chapters:
        - chapters/what-is-nim.qmd
        - chapters/installation.qmd
        - chapters/workflow.qmd
        - chapters/comments.qmd
        - chapters/variables.qmd
        - chapters/primitive-types.qmd
        - chapters/strings.qmd
        - chapters/printing.qmd
        - chapters/operators.qmd
        - chapters/conditionals.qmd
        - chapters/loops.qmd
        - chapters/collections.qmd
        - chapters/procedures.qmd
        - chapters/tuples.qmd
        - chapters/objects.qmd
        - chapters/enums-and-sets.qmd
    - part: "Part B: Intermediate"
      chapters:
        - chapters/modules.qmd
        - chapters/exceptions.qmd
        - chapters/iterators.qmd
        - chapters/closures.qmd
        - chapters/generics.qmd
        - chapters/templates.qmd
        - chapters/macros.qmd
        - chapters/concepts.qmd
        - chapters/variants-and-distinct.qmd
        - chapters/refs-and-pointers.qmd
        - chapters/memory-management.qmd
        - chapters/standard-library.qmd
        - chapters/files-and-os.qmd
        - chapters/unit-testing.qmd
        - chapters/async.qmd
        - chapters/ffi-c.qmd
        - chapters/js-backend.qmd
    - part: "Part C: Practice"
      chapters:
        - chapters/cli-tools.qmd
        - chapters/http-api.qmd
        - chapters/database.qmd
        - chapters/nimble-packages.qmd
        - chapters/benchmarking.qmd
        - chapters/cross-compile.qmd
        - chapters/final-project.qmd
  appendices:
    - appendix/answers.qmd
    - appendix/glossary.qmd
    - appendix/cheatsheet.qmd
    - appendix/nim-for-others.qmd
  search: true
  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - text: "Bahasa Indonesia"
        href: "https://nim.qouver.com/"
  page-footer:
    left: "CC BY-SA 4.0 · code samples MIT"
    right: "[PDF](https://nim.qouver.com/en/Learning-Nim.pdf) · [Bahasa Indonesia](https://nim.qouver.com/)"

format:
  html:
    lang: en
    css: assets/ku.css
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    fig-cap-location: bottom
  typst:
    lang: en
    template-partials:
      - assets/typst/typst-show.typ
    papersize: a5
    number-sections: true
