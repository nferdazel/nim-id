project:
  type: book
  resources:
    - assets/ku.css

book:
  title: "Learning Nim"
  subtitle: "From zero to working programs"
  author: "Sachiel"
  date: "2026-10-23"
  language: en
  chapters:
    - index.qmd
    - chapters/variables.qmd
  appendices:
    - appendix/answers.qmd
  search: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "CC BY-SA 4.0 · code samples MIT"
    right: "[Bahasa Indonesia](/) · Quarto"

format:
  html:
    lang: en
    css: assets/ku.css
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    fig-cap-location: bottom
  typst:
    papersize: a5
    number-sections: true
