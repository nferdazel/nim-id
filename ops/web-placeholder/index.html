<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dasar Pemrograman Nim — segera hadir</title>
    <meta name="description" content="Buku dan referensi belajar bahasa Nim dalam Bahasa Indonesia." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdfcf9;
        --fg: #1b1b19;
        --muted: #5c5c56;
        --rule: #ddd9d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --fg: #eceae4;
          --muted: #a3a09a;
          --rule: #2e2e33;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 34rem; }
      p.kicker {
        margin: 0 0 0.75rem;
        color: var(--muted);
        font-size: 0.8125rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p { margin: 0 0 1rem; color: var(--muted); }
      code {
        padding: 0.125rem 0.375rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.875em;
        color: var(--fg);
      }
      footer {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--rule);
        font-size: 0.875rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">nim.qouver.com</p>
      <h1>Dasar Pemrograman Nim</h1>
      <p>
        Buku belajar bahasa Nim dalam Bahasa Indonesia. Sedang ditulis, bab pertama
        menyusul. Setiap contoh kode di buku ini dikompilasi dan diuji otomatis,
        jadi yang tertulis di sini benar-benar jalan di <code>Nim 2.2.12</code>.
      </p>
      <footer>Lisensi teks CC BY-SA 4.0 · contoh kode MIT</footer>
    </main>
  </body>
</html>
