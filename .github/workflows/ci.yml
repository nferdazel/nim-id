# class: A
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A class A file must never cancel the run a deploy or a tag waits on.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Golden CI/CD contract: the same rules the server repo checks, run here so
  # drift fails this repo's own build instead of waiting for a manual audit.
  # The script is a byte-identical copy of the server repo's
  # ops/scripts/contract-check.sh; fix it there and copy it out again.
  # W26: the cheap gate in front of every expensive job. It runs the same script a laptop runs,
  # so a red run stops here in about a minute instead of at the end of the queue.
  # `--no-hook` keeps this job free of toolchain installs: the repo-specific static checks run in
  # the jobs that already have their dependencies, and the security job owns the secret scan.
  preflight:
    name: "Preflight: contract, scripts, secret scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Preflight: ./task gate"
        run: ./task gate --no-hook

  examples:
    name: "Examples: compile and verify output"
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Pasang Nim 2.4.2"
        uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: '2.4.2'

      - name: "Cache hasil kompilasi contoh"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: contoh-${{ runner.os }}-nim-2.4.2-${{ hashFiles('examples/**/*.nim') }}

      - name: "PCRE library for std/re"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3-dev

      - name: "Verify examples"
        run: bash tools/verify-examples.sh

      - name: "Verify appendix blocks"
        run: python3 tools/check-appendix.py

  # Independent of the build: a leaked secret fails on its own, and the full
  # history lets the scan see every commit the pull request adds, not just its tip.
  security:
    name: "Security (gitleaks)"
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # `needs: [preflight]` only: the render reads `books/**` and nothing the
  # `examples` job writes (`build/verify` is that job's own output). Waiting on it
  # put a 160 s job behind a 182 s one for no data, so the wall was the sum of the
  # two instead of the slower one. nimony-id, which renders the same way, never
  # had the edge either.
  book:
    name: "Book: render both languages + PDF"
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only the tag run creates a release; branch and pull request runs stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Book: ID/EN parity and terminology lint"
        run: |
          python3 tools/lint-glossary.py
          python3 tools/check-parity.py
          python3 tools/check-glossary-page.py

      - name: "Install Quarto 1.10.19"
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.10.19'

      - name: "Render Indonesian + English"
        run: bash tools/build-site.sh

      - name: "Upload site (both languages)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: situs
          path: public
          retention-days: 7

      - name: "Upload PDF"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf
          path: public/**/*.pdf
          retention-days: 30

      # F-15. A release exists only if the tag names this exact version: without
      # the guard a mistyped tag would publish 0.7.3 PDFs under a 0.7.8 label.
      - name: "Tag matches VERSION"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$TAG" ]; then
            echo "tag '$TAG' does not match VERSION '$version'" >&2
            exit 1
          fi

      # Same commit and the same Quarto and Nim versions the VPS uses, so these
      # attach the same PDFs the site serves. Re-running a failed tag build
      # uploads the assets again instead of failing on an existing release.
      - name: "Publish GitHub release"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -- \
            "public/Dasar-Pemrograman-Nim.pdf#Dasar Pemrograman Nim (ID).pdf" \
            "public/en/Learning-Nim.pdf#Learning Nim (EN).pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$@" --clobber
          else
            gh release create "$TAG" "$@" --title "$TAG" --generate-notes
          fi

  # U4 (docs/CICD_SIMPLIFY_PLAN.md): one check named `Gate`, the same shape the other
  # repositories carry, so branch protection has a single name to require instead of
  # four. `skipped` counts as failure; the results arrive through env, never inline.
  gate:
    name: "Gate"
    if: always()
    needs: [preflight, examples, security, book]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R_PREFLIGHT: ${{ needs.preflight.result }}
      R_EXAMPLES: ${{ needs.examples.result }}
      R_SECURITY: ${{ needs.security.result }}
      R_BOOK: ${{ needs.book.result }}
    steps:
      - name: "Gate: require every job"
        shell: bash
        run: |
          fail=0
          for r in "$R_PREFLIGHT" "$R_EXAMPLES" "$R_SECURITY" "$R_BOOK"; do
            [ "$r" = "success" ] || { echo "required job: $r"; fail=1; }
          done
          exit "$fail"
