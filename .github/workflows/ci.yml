name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: "Examples: compile and verify output"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: "Pasang Nim 2.4.2"
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: "Cache hasil kompilasi contoh"
        uses: actions/cache@v4
        with:
          path: build
          key: contoh-${{ runner.os }}-nim-2.4.2-${{ hashFiles('examples/**/*.nim') }}

      - name: "PCRE library for std/re"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3-dev

      - name: "Verify examples"
        run: bash tools/verify-examples.sh

      - name: "Verify appendix blocks"
        run: python3 tools/check-appendix.py

  book:
    name: "Book: render both languages + PDF"
    needs: examples
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only the tag run creates a release; branch and pull request runs stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "Book: ID/EN parity and terminology lint"
        run: |
          python3 tools/lint-glossary.py
          python3 tools/check-parity.py
          python3 tools/check-glossary-page.py

      - name: "Install Quarto 1.10.19"
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'

      - name: "Render Indonesian + English"
        run: bash tools/build-site.sh

      - name: "Upload site (both languages)"
        uses: actions/upload-artifact@v4
        with:
          name: situs
          path: public
          retention-days: 7

      - name: "Upload PDF"
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: public/**/*.pdf
          retention-days: 30

      # F-15. A release exists only if the tag names this exact version: without
      # the guard a mistyped tag would publish 0.7.3 PDFs under a 0.7.8 label.
      - name: "Tag matches VERSION"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$TAG" ]; then
            echo "tag '$TAG' does not match VERSION '$version'" >&2
            exit 1
          fi

      # Same commit and the same Quarto and Nim versions the VPS uses, so these
      # attach the same PDFs the site serves. Re-running a failed tag build
      # uploads the assets again instead of failing on an existing release.
      - name: "Publish GitHub release"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -- \
            "public/Dasar-Pemrograman-Nim.pdf#Dasar Pemrograman Nim (ID).pdf" \
            "public/en/Learning-Nim.pdf#Learning Nim (EN).pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$@" --clobber
          else
            gh release create "$TAG" "$@" --title "$TAG" --generate-notes
          fi
