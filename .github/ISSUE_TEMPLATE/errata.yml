name: Errata
description: A code example, a claim or a term in the book is wrong.
labels: ["errata"]
body:
  - type: markdown
    attributes:
      value: |
        Send a correction here. Do not send a security problem: see SECURITY.md for that.
  - type: input
    id: chapter
    attributes:
      label: Chapter
      description: The chapter and section, in either edition.
    validations:
      required: true
  - type: textarea
    id: what-is-wrong
    attributes:
      label: What the book says, and what is true
      description: Quote the sentence or the code block, then say what it should be.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nim version you tested
      description: The output of `nim --version`, and whether it differs from the version the README pins.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: How you checked it
      description: The smallest program or command that shows the difference, with its output.
