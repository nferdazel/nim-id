name: Chapter or content proposal
description: A new chapter, a restructure, or a translation.
labels: ["proposal"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The chapter or change, and the gap in the book it fills.
    validations:
      required: true
  - type: textarea
    id: reader
    attributes:
      label: Who it is for
      description: The reader you have in mind, and what they already know.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - New chapter
        - Restructure of existing chapters
        - New language edition
        - Tooling or build change
    validations:
      required: true
